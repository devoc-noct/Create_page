<body>
  <h1>用語集</h1>
  <div class="card">
  <h3>1. CLASS — 空間分類</h3>
    <p>記号：1～F<br>
class:1 ～ class:5 + class:F<br>
数字を使った分類コード。<br>
数字が大きいほど特殊現実と離れた特殊な空間。<br>
F は通常分類に当てはまらない特殊な空間。<br>
</p>
  </div>
<div class="card">
    <h3>2. STABILITY — 安定性</h3>
    <p>単位：%<br>
0% ～ 100%<br>
100%：非常に安定している。<br>
50%：不安定な部分がある。<br>        
0%：通常の空間として維持できないほど不安定。<br>
数値が高いほど安定している。</p>
</div>
    <script src="js/index.js"></script>
</body>
